name: CI

on:
  push:
  pull_request:

# New commits replace obsolete checks for this ref, not another PR or workflow.
# Push refs and PR merge refs stay separate so neither cancels the other's check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --fetch-retries=1 --fetch-timeout=15000
      - run: npm run test:dependency-audit
      - name: Verify live OSV vulnerability controls
        timeout-minutes: 5
        run: npm run test:dependency-audit:live
      - name: Audit locked dependencies with OSV (high and critical gate)
        timeout-minutes: 3
        run: npm run audit:dependencies
      - run: npm run verify
