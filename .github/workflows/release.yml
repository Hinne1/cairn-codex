name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
      - run: npm run verify
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-codex-${{ github.ref_name }}-win-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Create unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $files --generate-notes --prerelease --title "Cairn Codex $env:GITHUB_REF_NAME"
